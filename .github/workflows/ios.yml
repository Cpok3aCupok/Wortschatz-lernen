# Збирає непідписаний застосунок для iPhone (Wortschatz.ipa).
# Готовий файл — у вкладці Actions → цей запуск → Artifacts → Wortschatz-ipa.
# Встановлення: Sideloadly або AltStore з вашим Apple ID (див. README).
name: Збірка iOS (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'data/**'
      - 'ios/**'
      - 'tools/**'
      - '.github/workflows/ios.yml'

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Збірка вебчастини
        run: node tools/build.mjs

      - name: Копіювання вебчастини та іконки в iOS-проєкт
        run: |
          rm -rf ios/web
          cp -R dist ios/web
          cp dist/icons/icon-1024.png ios/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Генерація Xcode-проєкту
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Компіляція
        run: |
          xcodebuild -project ios/Wortschatz.xcodeproj -target Wortschatz \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/ios/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Пакування .ipa
        run: |
          mkdir -p Payload
          cp -R ios/build/Release-iphoneos/Wortschatz.app Payload/
          zip -qry Wortschatz.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Wortschatz-ipa
          path: Wortschatz.ipa
          retention-days: 30
